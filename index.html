<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Mi Princesa 💖</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Quicksand", sans-serif;
      }

      body {
        background: linear-gradient(
          135deg,
          #ff9a9e 0%,
          #fecfef 99%,
          #fecfef 100%
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
        position: relative;
      }

      /* Background floating hearts simulation */
      .bg-hearts {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }

      .container {
        position: relative;
        z-index: 10;
        width: 90%;
        max-width: 400px;
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        text-align: center;
        border: 3px solid #ff6b81;
      }

      /* Gift Box Area */
      .gift-section {
        margin-bottom: 20px;
      }

      .gift-box {
        font-size: 80px;
        cursor: pointer;
        transition: transform 0.3s ease;
        animation: bounce 2s infinite;
      }

      .gift-box:hover {
        transform: scale(1.1);
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-15px);
        }
        60% {
          transform: translateY(-7px);
        }
      }

      /* Album Section */
      .album-card {
        display: none;
        background: #fff0f3;
        border-radius: 15px;
        padding: 15px;
        border: 2px dashed #ff4757;
        animation: fadeIn 0.5s ease-in-out;
      }

      .album-title {
        color: #ff4757;
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 5px;
      }

      .album-subtitle {
        font-size: 0.85rem;
        color: #666;
        margin-bottom: 15px;
      }

      .grid-photos {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 15px;
      }

      .photo-item {
        background: #ffffff;
        padding: 8px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition: transform 0.2s;
        border: 1px solid #ffccd5;
      }

      .photo-item:hover {
        transform: translateY(-3px);
      }

      .photo-item img {
        width: 100%;
        height: 90px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 5px;
      }

      .photo-item span {
        font-size: 0.8rem;
        color: #ff6b81;
        font-weight: 600;
      }

      /* Message Display Box */
      .message-box {
        background: #fff;
        padding: 10px;
        border-radius: 10px;
        font-size: 0.9rem;
        color: #444;
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #ffb3c1;
        margin-bottom: 15px;
        font-style: italic;
      }

      /* Button */
      .btn-love {
        background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 25px;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        transition: all 0.3s ease;
      }

      .btn-love:hover {
        background: linear-gradient(135deg, #ff3344 0%, #ff5266 100%);
        box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
        transform: translateY(-2px);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Kotak Hadiah Awal -->
      <div class="gift-section" id="giftSection">
        <h2 style="color: #ff4757; margin-bottom: 10px">Buat Bebeh</h2>
        <p style="font-size: 0.9rem; color: #555; margin-bottom: 15px">
          Ketuk kotak di bawah untuk membuka hadiahmu!
        </p>
        <div class="gift-box" onclick="openGift()">🎁</div>
      </div>

      <!-- Album & Pesan Interaktif (Hidden dulu) -->
      <div class="album-card" id="albumCard">
        <div class="album-title">LOVELY ALBUM</div>
        <div class="album-subtitle">
          Ketuk setiap kotak di bawah untuk melihat pesan & kenangan kita!
        </div>

        <div class="grid-photos">
          <div class="photo-item" onclick="showMessage(1)">
            <img
              src="img/WhatsApp Image 2026-11-10 at 9.04.34 PM.jpeg"
              alt="Memory 1"
            />
            <span>Pesan 1</span>
          </div>
          <div class="photo-item" onclick="showMessage(2)">
            <img
              src="img/WhatsApp Image 2026-11-10 at 9.04.58 PM.jpeg"
              alt="Memory 2"
            />
            <span>Pesan 2</span>
          </div>
          <div class="photo-item" onclick="showMessage(3)">
            <img
              src="img/WhatsApp Image 2026-11-10 at 8.50.48 PM.jpeg"
              alt="Memory 3"
            />
            <span>Pesan 3</span>
          </div>
          <div class="photo-item" onclick="showMessage(4)">
            <img
              src="img/WhatsApp Image 2026-11-10 at 8.51.11 PM.jpeg"
              alt="Memory 4"
            />
            <span>Pesan 4</span>
          </div>
        </div>

        <div class="message-box" id="messageDisplay">
          "Pilih salah satu kotak kenangan di atas ya sayang..."
        </div>

        <button class="btn-love" onclick="sendRain()">Buka</button>
      </div>
    </div>

    <script>
      function openGift() {
        document.getElementById("giftSection").style.display = "none";
        document.getElementById("albumCard").style.display = "block";
      }

      function showMessage(id) {
        const messages = {
          1: "Terima kasih sudah selalu ada dan mengisi hari-hariku dengan kebahagiaan. Kamu sangat berarti!",
          2: "Senyumanmu adalah hal terindah yang selalu ingin kulihat setiap hari. Tetaplah tersenyum!",
          3: "Setiap detik bersamamu adalah memori berharga yang tidak akan pernah aku lupain.",
          4: "Kamu adalah gadis paling manis, baik, dan luar biasa yang pernah aku kenal. Aku sangat menyayangimu!",
        };
        document.getElementById(
          "messageDisplay"
        ).innerHTML = `"${messages[id]}"`;
      }

      function sendRain() {
        alert(
          "Hujan cinta dan pelukan terkirim khusus untukmu! Have a wonderful day!"
        );
      }
    </script>
  </body>
</html>
